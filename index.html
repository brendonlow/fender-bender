<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fender Bender Chooser: car insurance for a Geely EX5 in NSW</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 40 26" width="34" height="22"><path d="M20 2 L34 7 V13 C34 19 28 23 20 25 C12 23 6 19 6 13 V7 Z" fill="#fff"/><path d="M13 15 l2-4 h10 l2 4 v3 h-14 z" fill="#0b3d2e"/><circle cx="16" cy="18.5" r="1.6" fill="#f2b84b"/><circle cx="24" cy="18.5" r="1.6" fill="#f2b84b"/></svg></span>Fender Bender <span class="au">Chooser</span></div>
  <div class="topbar-controls">
    <div class="seg" id="viewMode" role="radiogroup" aria-label="View">
      <button data-view="decide" class="on" role="radio" aria-checked="true">Decide</button>
      <button data-view="quotes" role="radio" aria-checked="false">My quotes <span class="count" id="quoteCount"></span></button>
      <button data-view="tips" role="radio" aria-checked="false">Tips</button>
    </div>
  </div>
</header>

<main class="content">
  <div id="decideView" class="decide-view"></div>
  <div id="quotesView" class="quotes-view hidden"></div>
  <div id="tipsView" class="tips-view hidden"></div>
  <p class="disclaimer" id="disclaimer"></p>
</main>

<div class="modal hidden" id="detailModal" role="dialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" id="detailPanel"></div>
</div>

<script src="data.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
